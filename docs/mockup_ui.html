<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票智能体 Web 原型</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fb; margin:0; padding:24px; color:#1f2937; }
    .container { max-width:980px; margin:0 auto; background:#fff; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,0.08); padding:20px; }
    h1 { margin:0 0 16px; font-size:24px; }
    .chat { border:1px solid #d1d5db; border-radius:10px; padding:16px; height:320px; overflow:auto; background:#fafafa; }
    .msg { margin-bottom:12px; padding:10px 12px; border-radius:10px; max-width:78%; line-height:1.45; }
    .user { background:#dbeafe; margin-left:auto; }
    .bot { background:#e5e7eb; }
    .toolbar { display:grid; grid-template-columns:1fr auto auto; gap:12px; margin-top:16px; align-items:center; }
    input[type="text"] { width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px; font-size:14px; }
    .upload-wrap { display:flex; align-items:center; gap:8px; }
    button { border:none; border-radius:10px; padding:12px 16px; font-weight:600; cursor:pointer; }
    .upload-btn { background:#e2e8f0; }
    .submit-btn { background:#2563eb; color:white; }
    .hint { margin-top:10px; font-size:12px; color:#64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>股票智能体（LangChain + Ollama + MCP + RAG）</h1>

    <div class="chat">
      <div class="msg user">用户：贵州茅台</div>
      <div class="msg bot">助手：已获取实时价格，并结合你上传的资料生成股评（示例）……</div>
    </div>

    <div class="toolbar">
      <input type="text" value="请输入股票名称，我可以为您生成评论" />
      <div class="upload-wrap">
        <button class="upload-btn">上传文件</button>
      </div>
      <button class="submit-btn">提交</button>
    </div>

    <div class="hint">流程：上传资料 → 输入股票名称 → 提交 → 获取实时价格 + RAG 增强 → 输出评论</div>
  </div>
</body>
</html>
